<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellness Scribe POC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="banner">POC, test data only. Do not use real patient or client data.</div>
  <main>
    <h1>Wellness Scribe</h1>
    <p class="note">Audio is processed on this computer and is not stored.</p>
    <label class="consent">
      <input id="consent" type="checkbox">
      I have the client's consent to transcribe this session and send the transcript text to an external LLM to draft the note.
    </label>
    <div class="controls">
      <label>Language
        <select id="language">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="ms">Malay</option>
          <option value="zh">Mandarin</option>
          <option value="ta">Tamil (untested)</option>
        </select>
      </label>
      <button id="start" type="button">Start</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <p id="status" class="status">Idle</p>
    <section id="transcript" aria-live="polite"></section>
    <p id="partial" class="partial"></p>

    <section class="notes">
      <button id="generate" type="button" disabled>Generate note</button>
      <p class="warning">The transcript text (not the audio) is sent to an external LLM API to draft the note. Test data only.</p>
      <p id="noteStatus" class="status"></p>
      <textarea id="noteOutput" class="note-output" rows="12" disabled></textarea>
      <div class="controls">
        <button id="saveNote" type="button" disabled>Save edit</button>
        <button id="approveNote" type="button" disabled>Approve</button>
      </div>
      <p><a href="/sessions.html">Past sessions</a></p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
